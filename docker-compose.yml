version: '3.8'

# ============================================================================
# STAYWISE PLATFORM — HIGH-AVAILABILITY CLUSTER WITH LOAD BALANCER
# ============================================================================
# Architecture:
# - staywise-lb: NGINX Layer 7 Load Balancer (Port 80/443)
# - staywise-app-1: Next.js Production Replica 1
# - staywise-app-2: Next.js Production Replica 2
# - staywise-app-3: Next.js Production Replica 3
# - Shared volume for persistent atomic JSON database
# ============================================================================

services:
  # ----------------------------------------------------
  # 1. NGINX Reverse Proxy & Load Balancer
  # ----------------------------------------------------
  staywise-lb:
    image: nginx:alpine
    container_name: staywise-load-balancer
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/staywise-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      staywise-app-1:
        condition: service_healthy
      staywise-app-2:
        condition: service_healthy
      staywise-app-3:
        condition: service_healthy
    networks:
      - staywise-cluster-net

  # ----------------------------------------------------
  # 2. Staywise Next.js Worker Replica 1
  # ----------------------------------------------------
  staywise-app-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: staywise-node-1
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3005
      - CLUSTER_WORKER_ID=staywise-replica-1
    volumes:
      - staywise-db-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3005/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - staywise-cluster-net

  # ----------------------------------------------------
  # 3. Staywise Next.js Worker Replica 2
  # ----------------------------------------------------
  staywise-app-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: staywise-node-2
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3006
      - CLUSTER_WORKER_ID=staywise-replica-2
    volumes:
      - staywise-db-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3006/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - staywise-cluster-net

  # ----------------------------------------------------
  # 4. Staywise Next.js Worker Replica 3
  # ----------------------------------------------------
  staywise-app-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: staywise-node-3
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3007
      - CLUSTER_WORKER_ID=staywise-replica-3
    volumes:
      - staywise-db-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3007/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - staywise-cluster-net

networks:
  staywise-cluster-net:
    driver: bridge

volumes:
  staywise-db-data:
    driver: local
