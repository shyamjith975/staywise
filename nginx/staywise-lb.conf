# ============================================================================
# STAYWISE PLATFORM — PRODUCTION NGINX LOAD BALANCER & REVERSE PROXY
# ============================================================================
# High-Availability Layer 7 Load Balancing Architecture
# Features:
# - Upstream Cluster balancing across multi-port Next.js worker replicas
# - Algorithm: Least Connections (least_conn) with health checks
# - SSL/TLS 1.3 Termination with HSTS & forward secrecy
# - Rate Limiting & anti-DDoS connection throttling (limit_req)
# - Real client IP forwarding (X-Forwarded-For, X-Real-IP)
# - Micro-caching for Next.js static chunks
# ============================================================================

# Define Rate Limiting Zone (10 requests per second with burst 20)
limit_req_zone $binary_remote_addr zone=staywise_api_limit:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=staywise_conn_limit:10m;

# Upstream Multi-Worker Cluster Pool
upstream staywise_cluster {
    # Algorithm: Send traffic to the worker with the fewest active connections
    least_conn;

    # Primary Next.js Instance (Port 3005)
    server 127.0.0.1:3005 max_fails=3 fail_timeout=10s weight=5;

    # Secondary Worker Instance (Port 3006)
    server 127.0.0.1:3006 max_fails=3 fail_timeout=10s weight=5;

    # Tertiary Worker Instance (Port 3007)
    server 127.0.0.1:3007 max_fails=3 fail_timeout=10s weight=5;

    # Maintain keep-alive connections to upstream servers
    keepalive 64;
}

# HTTP Server — Redirect all insecure traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name staywise.in www.staywise.in app.staywise.in;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS with 301 Permanent Redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Main Server Configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staywise.in www.staywise.in app.staywise.in;

    # SSL Certificates (Cloudflare Origin CA / Let's Encrypt)
    ssl_certificate /etc/ssl/certs/staywise.crt;
    ssl_certificate_key /etc/ssl/private/staywise.key;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:StaywiseSSL:50m;
    ssl_session_tickets off;

    # Institutional Security Headers (OWASP Top 10)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Client payload size constraints (prevent memory exhaustion attacks)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Gzip Compression for maximum response throughput
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. Health Check Endpoint (Used by Cloudflare & external monitoring)
    location = /api/health {
        proxy_pass http://staywise_cluster/api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # 2. Next.js Static Assets & Chunk Caching (Cache heavily)
    location /_next/static/ {
        proxy_pass http://staywise_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 3. Public Media & Property Images
    location /images/ {
        proxy_pass http://staywise_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 4. API Endpoints with Rate Limiting
    location /api/ {
        limit_req zone=staywise_api_limit burst=20 nodelay;
        limit_conn staywise_conn_limit 10;

        proxy_pass http://staywise_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for API transactions
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 5. Core Application & Admin Dashboard Routing
    location / {
        proxy_pass http://staywise_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Proxy buffering tuning
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}
